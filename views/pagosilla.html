<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago | AnselmoGames</title>
  <link rel="icon" href="../img/isidoro.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/pagogta.css">
</head>
<body>



  <!-- Contenido de Pago -->
  <section class="checkout-container">
    <div class="container py-5">
      <h2 class="mb-4 text-center">Finalizar Compra</h2>
      <div class="row">
        <!-- Info del Producto -->
        <div class="col-md-6">
          <div class="card mb-4">
            <img src="../img/silla1.png" alt="Videojoc" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title">TITAN Evo VALORANT Jett – Silla Gaming (Regular)</h5>
              <p class="card-text">Marca: Secretlab</p>
              <p class="card-text"><strong>Preu:</strong> 549.99€</p>
            </div>
          </div>
        </div>

        <!-- Form de Pagament -->
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nom complet</label>
              <input type="text" class="form-control" id="nombre" placeholder="Ex: Marc García">
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label">Correu electrònic</label>
              <input type="email" class="form-control" id="correo" placeholder="tu@email.com">
            </div>

            <div class="mb-3">
              <label for="tarjeta" class="form-label">Número de targeta</label>
              <input type="text" class="form-control" id="tarjeta" placeholder="1234 5678 9012 3456">
            </div>

            <div class="row">
              <div class="col">
                <label for="fecha" class="form-label">Caducitat</label>
                <input type="text" class="form-control" id="fecha" placeholder="MM/AA">
              </div>
              <div class="col">
                <label for="cvv" class="form-label">CVV</label>
                <input type="text" class="form-control" id="cvv" placeholder="123">
              </div>
            </div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="guardar">
              <label class="form-check-label" for="guardar">
                Guardar dades per a futures compres
              </label>
            </div>

            <div class="text-center mt-4">
              <button type="button" class="btn btn-primary" onclick="realizarCompra()">Comprar</button>
          
            <script>
              function realizarCompra() {
              alert('✅ Compra realizada con éxito!');
              location.href = 'index.html';
            }
          </script>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
